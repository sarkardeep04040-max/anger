<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b71845">
  <title>For My Rishita ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Hind+Siliguri:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div id="background" aria-hidden="true"></div>
  <div id="petals" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">For Rishita <span>❤️</span></div>
    <nav id="pageDots" class="page-dots" aria-label="Story pages"></nav>
  </header>

  <main id="story">
    <section class="scene active" data-page="1" aria-label="The Beginning">
      <div class="poem-card page-poem"><p class="poem bengali" id="poem1"></p></div>
      <button class="next-btn" data-next="1">Next ❤️</button>
    </section>

    <section class="scene" data-page="2" aria-label="Our Memories">
      <div class="x-photo x-photo-one" id="xPhotoOne"></div>
      <div class="x-photo x-photo-two" id="xPhotoTwo"></div>
      <div class="poem-card page-poem"><p class="poem bengali" id="poem2"></p></div>
      <button class="next-btn" data-next="2">Next ❤️</button>
    </section>

    <section class="scene" data-page="3" aria-label="A Letter from My Heart">
      <div class="letter-area" id="letterArea">
        <p class="tap-message">A little message for you... Tap to open 💌</p>
        <button class="envelope" id="envelope" aria-label="Open the love letter">
          <span class="envelope-flap"></span><span class="envelope-heart">♥</span>
        </button>
      </div>
      <div class="letter-reveal" id="letterReveal" aria-hidden="true">
        <div class="poem-card reveal-poem"><p class="poem bengali" id="poem3"></p></div>
        <div class="revealed-photos" id="revealedPhotos"></div>
      </div>
      <button class="next-btn" id="page3Next" data-next="3" hidden>Next ❤️</button>
    </section>

    <section class="scene" data-page="4" aria-label="My Queen">
      <div class="queen-stage" id="queenStage">
        <div class="queen-card queen-upper" id="queenUpper"></div>
        <div class="queen-card queen-lower" id="queenLower"></div>
        <div class="poem-card queen-poem" id="queenPoem" aria-hidden="true"><p class="poem bengali" id="poem4"></p></div>
      </div>
      <button class="queen-btn" id="queenButton">Queen 👑</button>
      <button class="next-btn" id="page4Next" data-next="4" hidden>Next ❤️</button>
    </section>

    <section class="scene album-scene" data-page="5" aria-label="Our Love Album">
      <div class="rotation-hint" id="rotationHint">Please rotate your phone and click here ❤️</div>
      <button class="album-invite" id="albumInvite">
        <span>Open our love album</span><b>For Rishita ❤️</b>
      </button>

      <div class="album" id="album" aria-label="Interactive photo album">
        <div class="album-back"></div>
        <div class="album-spine"></div>
        <div class="album-pages" id="albumPages">
          <article class="album-page left-page" id="leftPage"></article>
          <article class="album-page right-page" id="rightPage"></article>
          <div class="turn-sheet" id="turnSheet"><span id="turnSheetText"></span></div>
        </div>
        <div class="album-front" id="albumFront">
          <div class="cover-heart">♥</div>
          <h1>Only for my girl Rishita <span>❤️</span></h1>
        </div>
        <div class="album-back-cover" id="albumBackCover"><h2>I Love You Forever ❤️</h2><div class="big-heart">♥</div></div>
      </div>
    </section>
  </main>

  <script src="src/assets/manifest.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
